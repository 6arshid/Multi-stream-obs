Facebook rejected the request - check permissions and app review=Facebook درخواست را رد کرد؛ مجوزها و تأیید برنامه را بررسی کنید
API mode creates a reusable live stream and broadcast automatically; manual mode uses the standard YouTube ingest server and key from YouTube Studio.=حالت API پخش و رویداد زندهٔ قابل استفادهٔ مجدد می‌سازد؛ حالت دستی از سرور و کلید YouTube Studio استفاده می‌کند.
API mode resolves the endpoint automatically. Manual mode: copy the Server URL and Stream key from Kick channel settings.=حالت API نشانی را خودکار دریافت می‌کند. در حالت دستی، نشانی سرور و کلید را از تنظیمات کانال Kick کپی کنید.
API mode resolves the key and the best server automatically; manual mode uses the key from the Restream dashboard.=حالت API کلید و بهترین سرور را خودکار دریافت می‌کند؛ حالت دستی از کلید داشبورد Restream استفاده می‌کند.
Any RTMP or RTMPS server: self-hosted ingest, Nginx-RTMP, and platforms not listed here.=سرور ورودی سفارشی RTMP یا RTMPS، از جمله Nginx-RTMP و پلتفرم‌های فهرست‌نشده.
BIGO LIVE streams through its own apps; there is no public API for third-party RTMP ingest from OBS, so this entry is informational.=BIGO LIVE از برنامه‌های خودش پخش می‌کند؛ این مورد صرفاً اطلاع‌رسانی است و ورودی RTMP از OBS ندارد.
Create a live video on instagram.com, then copy the Stream URL and Stream key. Eligibility rules apply.=در instagram.com پخش زنده بسازید و نشانی و کلید پخش را کپی کنید. شرایط دسترسی حساب اعمال می‌شود.
Creator dashboard -> Stream key; server: rtmp://stream.dlive.tv/live=داشبورد سازنده ← کلید پخش؛ سرور: rtmp://stream.dlive.tv/live
DLive broadcasting with the static ingest URL and the stream key from the creator dashboard. The GraphQL API requires an approved developer account.=پخش DLive با نشانی ثابت و کلید داشبورد سازنده. API GraphQL به حساب توسعه‌دهندهٔ تأییدشده نیاز دارد.
Device-code sign-in retrieves your channel stream key and can update the channel title. The ingest URL is Twitch's global ingest server.=ورود با کد دستگاه کلید کانال را دریافت می‌کند و می‌تواند عنوان را تغییر دهد. ورودی، سرور جهانی Twitch است.
Discord Go Live uses Discord's own voice gateway (UDP/Opus), not RTMP - OBS cannot feed it. Listed for clarity only.=Discord Go Live از دروازهٔ صوتی UDP/Opus استفاده می‌کند و ورودی RTMP از OBS ندارد؛ صرفاً برای اطلاع درج شده است.
Facebook Live through the Graph Video API: creates the live video on your profile, page or group and returns a per-broadcast RTMPS endpoint. Requires a reviewed Facebook app.=پخش Facebook Live با Graph Video API: رویداد زنده ایجاد و نشانی RTMPS اختصاصی دریافت می‌شود. برنامهٔ تأییدشدهٔ Facebook لازم است.
Google account sign-in creates the live broadcast and resolves the RTMPS ingest endpoint through the YouTube Live Streaming API.=ورود با حساب Google رویداد زنده می‌سازد و نشانی RTMPS را از API پخش زندهٔ YouTube دریافت می‌کند.
Instagram Live (Live Producer in the browser): paste the RTMPS URL and key while you set up the live video. No official broadcast API.=Instagram Live در مرورگر: هنگام تنظیم پخش، نشانی RTMPS و کلید را وارد کنید. API رسمی پخش در این افزونه وجود ندارد.
LinkedIn Live events. Ingest credentials exist only while a scheduled event is running; the Live Events API is limited to approved partners.=رویدادهای LinkedIn Live؛ اعتبارنامه هنگام رویداد زمان‌بندی‌شده ارائه می‌شود. API رویداد زنده محدود به همکاران تأییدشده است.
Manual mode: Creator Studio -> Stream shows the Host URL and Stream key. API mode reads the key for you.=حالت دستی: بخش Stream در Creator Studio نشانی میزبان و کلید را نشان می‌دهد. حالت API کلید را دریافت می‌کند.
Manual mode: Facebook Live Producer shows the Server and Stream key while you configure the live video.=حالت دستی: Facebook Live Producer هنگام تنظیم پخش، سرور و کلید را نشان می‌دهد.
Manual mode: Home -> Settings -> Stream on the Twitch dashboard shows the URL and key. API mode reads the key for you.=حالت دستی: در داشبورد Twitch، بخش Settings ← Stream نشانی و کلید را نشان می‌دهد. حالت API کلید را دریافت می‌کند.
OAuth 2.1 (PKCE) sign-in reads your channel's stream URL and key through the public Kick API; the API can also update the stream title before you go live.=ورود OAuth 2.1 با PKCE نشانی و کلید کانال را از API عمومی Kick دریافت می‌کند و پیش از پخش می‌تواند عنوان را تغییر دهد.
Rumble live streaming with the static server URL and channel stream key from the Live Control Room. The API cannot start broadcasts.=پخش Rumble با نشانی ثابت و کلید کانال از Live Control Room. شروع پخش با API پیاده‌سازی نشده است.
Schedule the event on LinkedIn, then paste its Server URL and Stream key before it starts.=رویداد LinkedIn را زمان‌بندی کرده و پیش از شروع، نشانی سرور و کلید را وارد کنید.
Session-based: copy the Server URL and Stream key from TikTok before each stream.=برای هر نشست: پیش از هر پخش، نشانی سرور و کلید را از TikTok کپی کنید.
Settings -> Live streaming in Rumble provides the Server URL and Stream key.=در Rumble بخش Settings ← Live streaming نشانی سرور و کلید پخش را ارائه می‌کند.
Sign in to Restream to read your stream key and choose the nearest ingest server from Restream's own server list, then Restream fans your single feed out to every connected channel.=برای دریافت کلید و انتخاب سرور ورودی به Restream وارد شوید؛ Restream خوراک واحد را به کانال‌های متصل ارسال می‌کند.
Start a live event in X to receive a stream key; server: rtmp://va.pscp.tv:80/x=برای دریافت کلید در X رویداد زنده بسازید؛ سرور: rtmp://va.pscp.tv:80/x
StreamYard is a browser studio that only sends RTMP out - it has no inbound RTMP ingest for OBS. Use StreamYard as a destination from your broadcast software, not as an OBS destination.=StreamYard استودیوی مرورگری با خروجی RTMP است و ورودی RTMP برای OBS ندارد؛ این مقصد قابل انتخاب نیست.
TikTok LIVE via the server URL and key shown in TikTok Live Studio or the Live Center. Access depends on account eligibility.=پخش TikTok LIVE با نشانی و کلید TikTok Live Studio یا Live Center. دسترسی به شرایط حساب بستگی دارد.
Trovo Open Platform API reads your stream key, can update the stream title, and validates tokens through the official developer program.=API رسمی Trovo کلید پخش را دریافت می‌کند، عنوان را تغییر می‌دهد و توکن‌ها را اعتبارسنجی می‌کند.
Vimeo -> Live Events: create or open the event and copy the RTMPS URL and stream key. Each event has its own endpoint.=در Vimeo بخش Live Events، رویداد را ایجاد یا باز کنید و نشانی RTMPS و کلید را کپی کنید. هر رویداد نشانی اختصاصی دارد.
Vimeo Live through manual RTMPS credentials: create a live event in Vimeo and paste its RTMPS URL and stream key. The Vimeo Live API (automatic key handling) is available only to approved development/enterprise partners.=پخش Vimeo با اعتبارنامهٔ دستی RTMPS؛ رویداد بسازید و نشانی و کلید را وارد کنید. API خودکار فقط برای همکاران تأییدشدهٔ سازمانی است.
X Live for eligible accounts (X Premium). The ingest URL is static, the key is issued per live event. The official Livestream API is closed to third parties.=X Live برای حساب‌های واجد شرایط؛ نشانی ثابت است و کلید برای هر رویداد صادر می‌شود. API پخش در این افزونه ارائه نشده است.
