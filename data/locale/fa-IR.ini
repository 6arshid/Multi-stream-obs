Twitch returned an empty stream key - check the channel:read:stream_key authorization=کلید Twitch خالی است؛ مجوز channel:read:stream_key را بررسی کنید
YouTube returned an incomplete ingest endpoint=نشانی ورودی YouTube ناقص است
Vimeo's Live API requires partner access - use manual mode=API زندهٔ Vimeo به دسترسی همکار تجاری نیاز دارد؛ از حالت دستی استفاده کنید
YouTube authorization expired - reconnect the account=مجوز YouTube منقضی شد؛ حساب را دوباره متصل کنید
